name: PR Validation

# Runs ONLY when a pull request targets main.
# No "push" trigger (avoids duplicate runs).
# No "paths" filter (a skipped workflow leaves required checks "Pending" forever).
on:
  pull_request:
    branches: [main]

# Least privilege: this workflow only needs to read the code.
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"   # keep equal to the FROM version in the Dockerfile
  IMAGE_NAME: memory-app

jobs:
  lint:
    name: Lint (Flake8)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev tools
        run: pip install -r requirements-dev.txt

      - name: Fail on syntax errors and undefined names
        run: flake8 app test --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Fail on any style violation
        run: flake8 app test --count --statistics

  test:
    name: Unit Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev tools
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest test -v --tb=short --junitxml=test-results/junit.xml

      - name: Upload test report
        if: always()   # upload the report even when tests fail
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: test-results/junit.xml

  sast:
    name: SAST (Bandit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev tools
        run: pip install -r requirements-dev.txt

      # -r: scan recursively. -ll: fail on MEDIUM and HIGH findings.
      # The 0.0.0.0 finding (B104) is accepted inline in app.py with a reason.
      - name: Run Bandit
        run: bandit -r app -ll

  secret-scan:
    name: Secret Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trivy filesystem secret scan
        uses: aquasecurity/trivy-action@0.28.0   # check the Marketplace for the latest tag
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          severity: CRITICAL,HIGH
          exit-code: "1"

  dockerfile-lint:
    name: Dockerfile Lint (Hadolint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  build-and-scan:
    name: Build & Scan Image (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true   # put the image into the runner's Docker so Trivy can scan it
          tags: ${{ env.IMAGE_NAME }}:pr-${{ github.event.number }}

      - name: Scan image for OS and Python package CVEs
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:pr-${{ github.event.number }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true   # only fail on vulnerabilities that have a fix
          exit-code: "1"